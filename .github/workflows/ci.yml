name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Generate clients (verify drift)
        run: npm run generate
      - name: Fail on generated drift
        run: git diff --exit-code -- clients/typescript schemas/catalog.json package.json
      - name: Schema check
        run: npm run check
      - name: Tests
        run: npm test
      - name: Typecheck generated clients
        run: npm run typecheck
